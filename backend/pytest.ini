[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --disable-warnings
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=html:exports/qa_reports/coverage_html
    --cov-fail-under=85
asyncio_mode = strict
markers =
    unit: Pruebas unitarias aisladas con mocks
    integration: Pruebas de integración entre componentes
    rag: Pruebas del pipeline de recuperación vectorial
    cache: Pruebas de memoria caché
    escalation: Pruebas de lógica de escalamiento humano
