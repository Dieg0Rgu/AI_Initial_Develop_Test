[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gastroteacher-backend"
version = "0.1.0"
description = "Gastroteacher Backend Package"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "chromadb>=0.5.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=4.1.0",
    "behave>=1.2.6",
    "flake8>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
include = [".", "app"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv"]
extraPaths = [".", "app"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]
