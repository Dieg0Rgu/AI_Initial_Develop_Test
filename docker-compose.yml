# ============================================================
# Gastroteacher AI Assistant — Orquestación con Docker Compose
# Uso:  docker compose up --build
# Frontend: http://localhost:80   (SPA + proxy /api)
# Backend:  http://localhost:8000 (FastAPI + Swagger /docs)
# ============================================================
name: gastroteacher

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastroteacher-backend
    ports:
      - "8000:8000"
    environment:
      # Ollama corre en el host (no dentro del contenedor)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      ENVIRONMENT: production
      # Persistencia relacional y vectorial dentro del volumen
      DB_PATH: /app/data/gastroteacher.db
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gastroteacher_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend/Rage_frontend
      dockerfile: Dockerfile
    container_name: gastroteacher-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gastroteacher_data:
    name: gastroteacher_data