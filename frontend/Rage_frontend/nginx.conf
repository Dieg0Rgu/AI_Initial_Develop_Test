# Nginx: Gastroteacher Frontend (SPA Vue 3)
# Los estáticos se sirven directamente; las rutas /api/* se
# redirigen al contenedor del backend FastAPI (docker-compose).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para respuestas rápidas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy hacia el backend FastAPI (servicio "backend" en docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Documentación OpenAPI / Swagger
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # SPA: cualquier otra ruta cae en index.html (rutas del router Vue)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo de assets con hash (Vite genera nombres únicos)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}